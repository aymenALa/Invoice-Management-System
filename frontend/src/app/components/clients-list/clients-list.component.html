<div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8 space-y-6">
  <!-- Header -->
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <p class="text-xs font-semibold uppercase tracking-wider text-[#818CF8]">Directory &amp; Portal Access</p>
      <h1 class="mt-1 text-2xl font-bold tracking-tight text-[#F8FAFC]">Clients</h1>
    </div>

    <button type="button" (click)="toggleClientForm()" class="ims-btn-primary">
      <i class="fa-solid" [ngClass]="showClientForm ? 'fa-xmark' : 'fa-user-plus'"></i>
      {{ showClientForm ? 'Close Form' : 'Add Client' }}
    </button>
  </div>

  <!-- Create / Edit Client Panel -->
  <div *ngIf="showClientForm" class="ims-card p-6">
    <h2 class="text-base font-semibold text-[#F8FAFC] mb-4">
      {{ editingClientId ? 'Edit Client Profile' : 'New Client Profile' }}
    </h2>

    <form [formGroup]="clientForm" (ngSubmit)="saveClient()" class="space-y-4">
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="ims-label" for="clientName">Client Name</label>
          <input id="clientName" type="text" formControlName="name" class="ims-input" placeholder="Northwind Studio">
        </div>
        <div>
          <label class="ims-label" for="clientEmailInput">Email Address</label>
          <input id="clientEmailInput" type="email" formControlName="email" class="ims-input" placeholder="billing@northwind.example">
        </div>
        <div>
          <label class="ims-label" for="clientPhone">Phone Number</label>
          <input id="clientPhone" type="text" formControlName="phoneNumber" class="ims-input" placeholder="+15550101001">
        </div>
        <div>
          <label class="ims-label" for="clientAddress">Billing Address</label>
          <input id="clientAddress" type="text" formControlName="address" class="ims-input" placeholder="420 Pine Street, Seattle, WA">
        </div>
      </div>

      <div class="flex justify-end gap-2.5 pt-2">
        <button type="button" (click)="cancelClientForm()" class="ims-btn-secondary">Cancel</button>
        <button type="submit" [disabled]="isSaving" class="ims-btn-primary">
          <i class="fa-solid fa-check"></i>
          {{ isSaving ? 'Saving...' : (editingClientId ? 'Update Client' : 'Save Client') }}
        </button>
      </div>
    </form>
  </div>

  <!-- Search & Portal Status Filter -->
  <div class="ims-card p-4">
    <div class="grid gap-3 sm:grid-cols-12 sm:items-end">
      <div class="sm:col-span-8">
        <label class="ims-label" for="clientSearch">Search Clients</label>
        <input id="clientSearch" type="text" [(ngModel)]="searchQuery" placeholder="Filter by name, email, or phone..." class="ims-input">
      </div>
      <div class="sm:col-span-4">
        <label class="ims-label" for="portalFilter">Portal Status</label>
        <select id="portalFilter" [(ngModel)]="portalFilter" class="ims-input">
          <option value="ALL">All Portal States</option>
          <option value="ACTIVE">Active Portal</option>
          <option value="BLOCKED">Blocked Portal</option>
          <option value="PENDING">Not Activated</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Clients Table -->
  <div class="ims-card overflow-hidden">
    <div *ngIf="isLoading" class="p-6 space-y-3">
      <div *ngFor="let i of [1,2,3,4]" class="ims-skeleton h-12 w-full"></div>
    </div>

    <div *ngIf="!isLoading && filteredClients.length === 0" class="p-10 text-center text-sm text-[#94A3B8]">
      No clients found matching your filter.
    </div>

    <div *ngIf="!isLoading && filteredClients.length > 0" class="overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="border-b border-[#263246] bg-[#0B0F19]/60 text-[11px] font-semibold uppercase tracking-wider text-[#94A3B8]">
          <tr>
            <th class="px-5 py-3.5">Client</th>
            <th class="px-5 py-3.5">Contact</th>
            <th class="px-5 py-3.5">Portal Status</th>
            <th class="px-5 py-3.5 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-[#263246]/70">
          <tr *ngFor="let client of filteredClients" class="transition-colors hover:bg-[#192338]/60">
            <td class="px-5 py-4">
              <p class="font-semibold text-[#F8FAFC]">{{ client.name }}</p>
              <p *ngIf="client.address" class="mt-0.5 text-xs text-[#64748B] max-w-xs truncate">{{ client.address }}</p>
            </td>
            <td class="px-5 py-4">
              <p class="text-xs text-[#F8FAFC]">{{ client.email }}</p>
              <p *ngIf="client.phoneNumber" class="mt-0.5 font-mono text-xs text-[#94A3B8]">{{ client.phoneNumber }}</p>
            </td>
            <td class="px-5 py-4">
              <span *ngIf="client.portalAccountExists && client.portalAccessEnabled" class="ims-badge ims-badge-paid">
                Active
              </span>
              <span *ngIf="client.portalAccountExists && !client.portalAccessEnabled" class="ims-badge ims-badge-overdue">
                Blocked
              </span>
              <span *ngIf="!client.portalAccountExists" class="ims-badge ims-badge-draft">
                Not Activated
              </span>
            </td>
            <td class="px-5 py-4 text-right">
              <div class="inline-flex flex-wrap items-center justify-end gap-1.5">
                <button type="button" (click)="viewClientInvoices(client.id)" class="ims-btn-secondary py-1.5 px-2.5 text-xs">
                  <i class="fa-solid fa-file-invoice"></i>
                  Invoices
                </button>
                <button
                  *ngIf="!client.portalAccountExists"
                  type="button"
                  (click)="generateAccessCode(client)"
                  class="ims-btn-secondary py-1.5 px-2.5 text-xs text-[#818CF8]">
                  <i class="fa-solid fa-key"></i>
                  Access Code
                </button>
                <button
                  *ngIf="client.portalAccountExists"
                  type="button"
                  (click)="toggleClientPortalAccess(client)"
                  [class]="client.portalAccessEnabled ? 'ims-btn-danger py-1.5 px-2.5 text-xs' : 'ims-btn-secondary py-1.5 px-2.5 text-xs text-emerald-400'">
                  <i class="fa-solid" [ngClass]="client.portalAccessEnabled ? 'fa-ban' : 'fa-unlock'"></i>
                  {{ client.portalAccessEnabled ? 'Block' : 'Unblock' }}
                </button>
                <button type="button" (click)="editClient(client)" class="ims-btn-ghost py-1.5 px-2 text-xs" title="Edit client">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button type="button" (click)="deleteClient(client.id)" class="ims-btn-ghost py-1.5 px-2 text-xs text-red-400 hover:text-red-300" title="Delete client">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
