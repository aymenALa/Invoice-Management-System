<div class="mx-auto max-w-3xl px-4 py-8 sm:px-6 lg:px-8 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <a routerLink="/invoices" class="inline-flex items-center gap-1.5 text-xs font-medium text-[#94A3B8] hover:text-[#F8FAFC]">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Invoices
      </a>
      <h1 class="mt-2 text-2xl font-bold tracking-tight text-[#F8FAFC]">
        {{ isEditMode ? 'Edit Invoice' : 'Create New Invoice' }}
      </h1>
    </div>
  </div>

  <div class="ims-card p-6 sm:p-8">
    <form [formGroup]="invoiceForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Client Selection -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="ims-label mb-0" for="clientId">Client</label>
          <button type="button" (click)="toggleClientForm()" class="text-xs font-semibold text-[#818CF8] hover:text-[#6366F1]">
            {{ showClientForm ? 'Hide Quick Add' : '+ Quick Add Client' }}
          </button>
        </div>
        <select id="clientId" formControlName="clientId" class="ims-input">
          <option value="">Select a client...</option>
          <option *ngFor="let client of clients" [value]="client.id">{{ client.name }} ({{ client.email }})</option>
        </select>
        <p *ngIf="invoiceForm.get('clientId')?.touched && invoiceForm.get('clientId')?.invalid" class="mt-1 text-xs text-red-400">
          Please select a client.
        </p>
      </div>

      <!-- Inline Quick-Create Client Panel -->
      <div *ngIf="showClientForm" [formGroup]="clientForm" class="rounded-xl border border-[#263246] bg-[#0B0F19]/80 p-5 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-semibold text-[#F8FAFC]">Quick Create Client</h2>
          <button type="button" (click)="toggleClientForm()" class="text-xs text-[#94A3B8] hover:text-[#F8FAFC]">Close</button>
        </div>
        <div class="grid gap-3 sm:grid-cols-2">
          <div>
            <label class="ims-label">Client Name</label>
            <input type="text" formControlName="name" class="ims-input" placeholder="Northwind Studio">
          </div>
          <div>
            <label class="ims-label">Email</label>
            <input type="email" formControlName="email" class="ims-input" placeholder="billing@client.com">
          </div>
          <div>
            <label class="ims-label">Phone Number</label>
            <input type="text" formControlName="phoneNumber" class="ims-input" placeholder="+15550101001">
          </div>
          <div>
            <label class="ims-label">Address</label>
            <input type="text" formControlName="address" class="ims-input" placeholder="420 Pine St, Seattle, WA">
          </div>
        </div>
        <div class="flex justify-end">
          <button type="button" (click)="createClient()" [disabled]="clientForm.invalid" class="ims-btn-primary text-xs">
            Save &amp; Select Client
          </button>
        </div>
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="ims-label" for="invoiceNumber">Invoice Number</label>
          <input id="invoiceNumber" type="text" formControlName="invoiceNumber" class="ims-input font-mono" placeholder="INV-2026-015">
          <p *ngIf="invoiceForm.get('invoiceNumber')?.touched && invoiceForm.get('invoiceNumber')?.invalid" class="mt-1 text-xs text-red-400">
            Invoice number is required.
          </p>
        </div>

        <div>
          <label class="ims-label" for="status">Status</label>
          <select id="status" formControlName="status" class="ims-input">
            <option *ngFor="let st of statuses" [value]="st">{{ st }}</option>
          </select>
        </div>
      </div>

      <div class="grid gap-4 sm:grid-cols-3">
        <div>
          <label class="ims-label" for="issueDate">Issue Date</label>
          <input id="issueDate" type="date" formControlName="issueDate" class="ims-input">
        </div>

        <div>
          <label class="ims-label" for="dueDate">Due Date</label>
          <input id="dueDate" type="date" formControlName="dueDate" class="ims-input">
          <p *ngIf="invoiceForm.hasError('dueBeforeIssue')" class="mt-1 text-xs text-red-400">
            Due date cannot be before issue date.
          </p>
        </div>

        <div>
          <label class="ims-label" for="totalAmount">Total Amount (USD)</label>
          <input id="totalAmount" type="number" step="0.01" min="0.01" formControlName="totalAmount" class="ims-input font-mono" placeholder="1250.00">
          <p *ngIf="invoiceForm.get('totalAmount')?.touched && invoiceForm.get('totalAmount')?.invalid" class="mt-1 text-xs text-red-400">
            Amount must be greater than 0.
          </p>
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 border-t border-[#263246] pt-5">
        <a routerLink="/invoices" class="ims-btn-secondary">Cancel</a>
        <button type="submit" [disabled]="isSubmitting" class="ims-btn-primary">
          <i class="fa-solid fa-check"></i>
          {{ isSubmitting ? 'Saving...' : (isEditMode ? 'Update Invoice' : 'Create Invoice') }}
        </button>
      </div>
    </form>
  </div>
</div>
