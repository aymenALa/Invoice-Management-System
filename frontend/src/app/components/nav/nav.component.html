  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3.5 sm:px-6 lg:px-8">
    <div class="flex items-center gap-8">
      <a routerLink="/dashboard" class="flex items-center gap-2.5">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#6366F1] text-white">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h4m-7 5h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H8l-4 4v12a2 2 0 0 0 2 2Z" />
          </svg>

      </a>

      <ul class="hidden md:flex items-center gap-1">
        <li>
          <a routerLink="/dashboard" routerLinkActive="bg-[#192338] text-[#F8FAFC] border-[#263246]" class="rounded-lg border border-transparent px-3 py-2 text-sm font-medium text-[#94A3B8] transition-colors hover:text-[#F8FAFC]">
            <i class="fa-solid fa-chart-pie mr-1.5 text-xs"></i>
            Dashboard
          </a>
        </li>
        <li>
          <a routerLink="/clients" routerLinkActive="bg-[#192338] text-[#F8FAFC] border-[#263246]" class="rounded-lg border border-transparent px-3 py-2 text-sm font-medium text-[#94A3B8] transition-colors hover:text-[#F8FAFC]">
            <i class="fa-solid fa-users mr-1.5 text-xs"></i>
            Clients
          </a>
        </li>
        <li>
          <a routerLink="/invoices" routerLinkActive="bg-[#192338] text-[#F8FAFC] border-[#263246]" class="rounded-lg border border-transparent px-3 py-2 text-sm font-medium text-[#94A3B8] transition-colors hover:text-[#F8FAFC]">
            <i class="fa-solid fa-file-invoice-dollar mr-1.5 text-xs"></i>
            Invoices
          </a>

    <div class="flex items-center gap-2">
      <!-- Account Dropdown -->
      <div class="relative hidden md:block">
        <button
          type="button"
          (click)="toggleDropdown()"
          class="account-button flex items-center gap-2 rounded-lg border border-[#263246] bg-[#131C2B] px-3 py-1.5 text-sm font-medium text-[#F8FAFC] transition-colors hover:border-[#3B4C68]">
          <span class="flex h-6 w-6 items-center justify-center rounded-full bg-[#6366F1]/20 text-xs font-bold text-[#818CF8]">
            {{ displayName.charAt(0).toUpperCase() }}
          </span>
          <span class="max-w-[140px] truncate">{{ displayName }}</span>
          <i class="fa-solid fa-chevron-down text-[10px] text-[#94A3B8]"></i>
        </button>

        <div *ngIf="isDropdownOpen" class="dropdown-menu absolute right-0 mt-2 w-52 rounded-xl border border-[#263246] bg-[#131C2B] py-1.5 shadow-xl z-40">
          <button type="button" (click)="openSettings()" class="flex w-full items-center gap-2.5 px-4 py-2 text-left text-sm text-[#F8FAFC] hover:bg-[#192338]">
            <i class="fa-solid fa-gear text-xs text-[#94A3B8]"></i>
            Account Settings
          </button>
          <div class="my-1 border-t border-[#263246]"></div>
          <button type="button" (click)="logout()" class="flex w-full items-center gap-2.5 px-4 py-2 text-left text-sm text-red-400 hover:bg-red-500/10">

          </button>
        </div>

      <!-- Mobile Menu Button -->
      <button
        type="button"
        (click)="toggleMobileMenu()"
        aria-label="Toggle navigation menu"
        class="inline-flex md:hidden items-center justify-center rounded-lg border border-[#263246] bg-[#131C2B] p-2 text-[#F8FAFC] hover:bg-[#192338]">

  <!-- Mobile Drawer -->
  <div *ngIf="isMobileMenuOpen" class="border-t border-[#263246] bg-[#131C2B] px-4 py-3 md:hidden space-y-1">
    <a routerLink="/dashboard" (click)="closeMobileMenu()" routerLinkActive="bg-[#192338] text-[#F8FAFC]" class="block rounded-lg px-3 py-2 text-sm font-medium text-[#94A3B8]">
      Dashboard
    </a>
    <a routerLink="/clients" (click)="closeMobileMenu()" routerLinkActive="bg-[#192338] text-[#F8FAFC]" class="block rounded-lg px-3 py-2 text-sm font-medium text-[#94A3B8]">
      Clients
    </a>
    <a routerLink="/invoices" (click)="closeMobileMenu()" routerLinkActive="bg-[#192338] text-[#F8FAFC]" class="block rounded-lg px-3 py-2 text-sm font-medium text-[#94A3B8]">
      Invoices
    </a>
    <div class="my-2 border-t border-[#263246]"></div>
    <button type="button" (click)="openSettings()" class="block w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-[#F8FAFC] hover:bg-[#192338]">
      Account Settings ({{ displayName }})
    </button>
    <button type="button" (click)="logout()" class="block w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-red-400 hover:bg-red-500/10">
      Logout
    </button>

</nav>

<!-- Account Settings Modal -->
<div *ngIf="isSettingsOpen" (click)="closeSettings()" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4 backdrop-blur-sm">
  <section (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-label="Account Settings" class="ims-card w-full max-w-md p-6 shadow-2xl">
    <header class="flex items-start justify-between border-b border-[#263246] pb-4">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wider text-[#818CF8]">Account</p>
        <h2 class="mt-0.5 text-lg font-bold text-[#F8FAFC]">Settings</h2>
      </div>
      <button type="button" class="ims-btn-ghost p-1.5" (click)="closeSettings()" aria-label="Close account settings">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </header>

    <div class="mt-4 grid grid-cols-2 rounded-lg border border-[#263246] bg-[#0B0F19] p-1">
      <button
        type="button"
        [class]="activeSettingsTab === 'profile' ? 'bg-[#6366F1] text-white' : 'text-[#94A3B8] hover:text-[#F8FAFC]'"
        class="rounded-md px-3 py-1.5 text-xs font-semibold transition-colors"
        (click)="setSettingsTab('profile')">
        Profile
      </button>
      <button
        type="button"
        [class]="activeSettingsTab === 'password' ? 'bg-[#6366F1] text-white' : 'text-[#94A3B8] hover:text-[#F8FAFC]'"
        class="rounded-md px-3 py-1.5 text-xs font-semibold transition-colors"
        (click)="setSettingsTab('password')">
        Password
      </button>
    </div>

    <div *ngIf="settingsError" class="mt-4 rounded-lg border border-red-500/30 bg-red-500/10 px-3.5 py-2.5 text-xs text-red-300">
      {{ settingsError }}
    </div>
    <div *ngIf="settingsSuccess" class="mt-4 rounded-lg border border-emerald-500/30 bg-emerald-500/10 px-3.5 py-2.5 text-xs text-emerald-300">
      {{ settingsSuccess }}
    </div>

    <form *ngIf="activeSettingsTab === 'profile'" [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="mt-4 space-y-3.5">
      <div>
        <label class="ims-label">Username</label>
        <input type="text" formControlName="username" readonly class="ims-input opacity-60 cursor-not-allowed">
      </div>
      <div>
        <label class="ims-label">Email</label>
        <input type="email" formControlName="email" class="ims-input">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="ims-label">First Name</label>
          <input type="text" formControlName="firstName" class="ims-input">
        </div>
        <div>
          <label class="ims-label">Last Name</label>
          <input type="text" formControlName="lastName" class="ims-input">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" (click)="closeSettings()" class="ims-btn-secondary">Cancel</button>
        <button type="submit" class="ims-btn-primary">
          <i class="fa-solid fa-check"></i>
          Save Changes
        </button>
      </div>
    </form>

    <form *ngIf="activeSettingsTab === 'password'" [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="mt-4 space-y-3.5">
      <div>
        <label class="ims-label">Current Password</label>
        <input type="password" formControlName="currentPassword" class="ims-input">
      </div>
      <div>
        <label class="ims-label">New Password</label>
        <input type="password" formControlName="newPassword" class="ims-input">
      </div>
      <div>
        <label class="ims-label">Confirm New Password</label>
        <input type="password" formControlName="confirmPassword" class="ims-input">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" (click)="closeSettings()" class="ims-btn-secondary">Cancel</button>
        <button type="submit" class="ims-btn-primary">
          <i class="fa-solid fa-key"></i>
          Change Password
        </button>
      </div>
    </form>
  </section>
</div>
